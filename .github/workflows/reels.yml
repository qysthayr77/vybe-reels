name: Vybe Reels Collector

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: vybe-reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: |
          python -m pip install -U yt-dlp
          yt-dlp --version
          ffmpeg -version | head -1

      - run: npm ci

      - name: Write YouTube cookies (optional)
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s' "$COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi
        env:
          COOKIES: ${{ secrets.YTDLP_COOKIES_TXT }}

      - name: Run one collection cycle
        run: node server.js --once
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ENABLE_TIKTOK_APIFY: ${{ vars.ENABLE_TIKTOK_APIFY || 'false' }}
          IRAQ_CHANNELS: ${{ vars.IRAQ_CHANNELS }}
          IRAQ_TIKTOK_USERS: ${{ vars.IRAQ_TIKTOK_USERS }}
          PER_TAG: ${{ vars.PER_TAG || '6' }}
          MAX_REELS: ${{ vars.MAX_REELS || '400' }}
          KEEP_DAYS: ${{ vars.KEEP_DAYS || '14' }}
