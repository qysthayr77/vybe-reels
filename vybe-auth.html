<script id="vybe-feed-algo">/**
 * Vybe — Main Feed Algorithm  (v2: Node.js + Browser, Firebase Realtime DB adapter)
 * ---------------------------------------------------------------------------
 * generateSmartFeed(posts, options) -> Post[]
 * adaptRtdbPosts(rawPosts, commentsAll, reactsAll, opts) -> Post[]   (بيانات Vybe الفعلية)
 *
 * الضمانات:
 *  1) ممنوع منشورين متتاليين لنفس الناشر (صارم).
 *  2) حد أقصى لكل مصدر في الجلسة (perSourceCap).
 *  3) توزيع عادل بين: RSS / حسابات تفاعلية (bot) / مستخدمين حقيقيين.
 *  4) تنويع المجالات.
 *  5) Cold-Start Boost لمنشورات المستخدمين الجدد (يتلاشى خطياً).
 *
 * شكل المنشور الداخلي:
 * { id, authorId, authorHandle, sourceType:'rss'|'bot'|'user', category,
 *   impactScore:0..100, commentsCount, createdAt: ms|Date|ISO|Firestore Timestamp }
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.VybeFeed = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DEFAULT_CONFIG = {
    limit: 50,
    poolSize: 500,
    perSourceCap: 3,

    impactWeight: 0.65,
    commentsWeight: 0.35,
    commentsSaturation: 50,
    baseFreshness: 0.10,       // أرضية صغيرة حتى تترتب المنشورات عديمة التفاعل حسب الحداثة
    halfLifeHours: 8,
    maxAgeHours: 72,

    coldStartWindowMin: 60,
    coldStartBoost: 0.45,

    targetMix: { user: 0.40, rss: 0.35, bot: 0.25 },
    mixStrength: 1.2,
    mixClamp: [0.5, 1.6],

    sourceFatigue: 0.85,
    categoryWindow: 3,
    categoryPenalty: 0.75,

    capByType: { user: 4, rss: 3, bot: 3 },   // سقف المصدر حسب النوع (المستخدم الحقيقي أوسع)
    followBoost: 1.35,         // مضاعف لمنشورات من تتابعهم (options.following = Set)
    typeStreakMax: 2,          // بعد كم منشور متتالي من نفس النوع تبدأ العقوبة
    typeStreakPenalty: 0.5,
    me: null,                  // معرّف المستخدم الحالي: منشوراته معفاة من السقف
    following: null,
    seen: null,                // { [postId]: عدد مرات ظهوره في جلسات سابقة }
    seenPenalty: 0.6,          // يضرب الدرجة لكل ظهور سابق (حد أقصى 3 مرات)
    jitter: 0.10,              // تنويع بسيط ±10% يتغير مع كل جلسة
    seed: undefined,           // بذرة الجلسة؛ نفس البذرة = نفس الترتيب
    now: undefined,
    debug: false,
  };

  function toMillis(t) {
    if (t == null) return NaN;
    if (typeof t === 'number') return t;
    if (t instanceof Date) return t.getTime();
    if (typeof t.toMillis === 'function') return t.toMillis();
    if (typeof t.seconds === 'number') return t.seconds * 1000 + Math.floor((t.nanoseconds || 0) / 1e6);
    return Date.parse(t);
  }

  function rng(seedStr) { // mulberry32
    let h = 1779033703 ^ seedStr.length;
    for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    let t = (h += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const sourceKey = (p) => String(p.authorId != null ? p.authorId : (p.authorHandle != null ? p.authorHandle : 'unknown'));

  function sameAuthor(a, b) {
    if (!a || !b) return false;
    if (a.authorId != null && b.authorId != null && a.authorId === b.authorId) return true;
    if (a.authorHandle != null && b.authorHandle != null &&
        String(a.authorHandle).toLowerCase() === String(b.authorHandle).toLowerCase()) return true;
    return false;
  }

  function normalizeType(p) {
    const t = String(p.sourceType || '').toLowerCase();
    return t === 'rss' || t === 'bot' || t === 'user' ? t : 'user';
  }

  function baseScore(post, now, cfg) {
    const created = toMillis(post.createdAt);
    if (!Number.isFinite(created)) return null;

    const ageHours = Math.max(0, (now - created) / 3.6e6);
    if (ageHours > cfg.maxAgeHours) return null;

    const impact = clamp(Number(post.impactScore) || 0, 0, 100) / 100;
    const comments = Math.max(0, Number(post.commentsCount) || 0);
    const commentsNorm = clamp(Math.log1p(comments) / Math.log1p(cfg.commentsSaturation), 0, 1);

    const engagement = impact * cfg.impactWeight + commentsNorm * cfg.commentsWeight;
    const decay = Math.pow(0.5, ageHours / cfg.halfLifeHours);

    let boost = 0;
    if (normalizeType(post) === 'user') {
      const ageMin = ageHours * 60;
      if (ageMin < cfg.coldStartWindowMin) boost = cfg.coldStartBoost * (1 - ageMin / cfg.coldStartWindowMin);
    }

    return { score: (engagement + cfg.baseFreshness) * decay + boost, ageHours, engagement, decay, boost, created };
  }

  function generateSmartFeed(rawPosts, options) {
    options = options || {};
    if (!Array.isArray(rawPosts) || rawPosts.length === 0) return [];

    const cfg = Object.assign({}, DEFAULT_CONFIG, options, {
      targetMix: Object.assign({}, DEFAULT_CONFIG.targetMix, options.targetMix || {}),
    });
    const now = cfg.now != null ? cfg.now : Date.now();

    const seen = new Set();
    let pool = [];
    for (const post of rawPosts) {
      if (!post || post.id == null || seen.has(post.id)) continue;
      seen.add(post.id);
      const s = baseScore(post, now, cfg);
      if (!s) continue;
      if (cfg.following && cfg.following.has && cfg.following.has(sourceKey(post))) s.score *= cfg.followBoost;
      if (cfg.seen && cfg.seen[post.id]) s.score *= Math.pow(cfg.seenPenalty, Math.min(cfg.seen[post.id], 3));
      if (cfg.jitter && cfg.seed != null) s.score *= 1 + (rng(String(cfg.seed) + ':' + post.id) - 0.5) * 2 * cfg.jitter;
      pool.push(Object.assign({ post, type: normalizeType(post), src: sourceKey(post), cat: post.category || 'other' }, s));
    }

    pool.sort((a, b) => b.score - a.score || b.created - a.created);
    if (pool.length > cfg.poolSize) pool = pool.slice(0, cfg.poolSize);

    const feed = [];
    const used = new Array(pool.length).fill(false);
    const srcCount = new Map();
    const typeCount = { user: 0, rss: 0, bot: 0 };
    const recentCats = [];
    const dupSeen = new Set();
    const meKey = cfg.me != null ? String(cfg.me) : null;
    const mixLo = cfg.mixClamp[0], mixHi = cfg.mixClamp[1];

    while (feed.length < cfg.limit) {
      const last = feed.length ? feed[feed.length - 1].post : null;
      const total = feed.length || 1;
      let bestIdx = -1, bestAdj = -Infinity;

      for (let i = 0; i < pool.length; i++) {
        if (used[i]) continue;
        const c = pool[i];

        const n = srcCount.get(c.src) || 0;
        const cap = c.src === meKey ? Infinity : (cfg.capByType && cfg.capByType[c.type] != null ? cfg.capByType[c.type] : cfg.perSourceCap);
        if (n >= cap) continue;
        if (sameAuthor(last, c.post)) continue;
        if (c.post.dupKey && dupSeen.has(c.post.dupKey)) continue;   // نفس الخبر من قناة ثانية

        const share = typeCount[c.type] / total;
        const deficit = (cfg.targetMix[c.type] != null ? cfg.targetMix[c.type] : 0.33) - share;
        const mixMult = clamp(1 + deficit * cfg.mixStrength, mixLo, mixHi);
        const fatigue = Math.pow(cfg.sourceFatigue, n);

        let catRepeats = 0;
        for (const rc of recentCats) if (rc === c.cat) catRepeats++;
        const catMult = Math.pow(cfg.categoryPenalty, catRepeats);

        let streak = 0;
        for (let k = feed.length - 1; k >= 0 && feed[k].type === c.type; k--) streak++;
        const streakMult = streak >= cfg.typeStreakMax ? cfg.typeStreakPenalty : 1;

        const adj = c.score * mixMult * fatigue * catMult * streakMult;
        if (adj > bestAdj) { bestAdj = adj; bestIdx = i; }
      }

      if (bestIdx === -1) break;

      const pick = pool[bestIdx];
      used[bestIdx] = true;
      srcCount.set(pick.src, (srcCount.get(pick.src) || 0) + 1);
      if (pick.post.dupKey) dupSeen.add(pick.post.dupKey);
      typeCount[pick.type]++;
      recentCats.push(pick.cat);
      if (recentCats.length > cfg.categoryWindow) recentCats.shift();
      feed.push(Object.assign({}, pick, { finalScore: bestAdj }));
    }

    return feed.map((f) => cfg.debug
      ? Object.assign({}, f.post, { feedMeta: { finalScore: f.finalScore, baseScore: f.score, engagement: f.engagement, decay: f.decay, coldStartBoost: f.boost, ageHours: f.ageHours, type: f.type, source: f.src } })
      : f.post);
  }

  /**
   * محوّل بيانات Vybe (Firebase Realtime Database):
   *  posts/{id}    = { id, uid, n, h, x, tg, ts, bot?, feed? }
   *  comments/{pid}/{k} = { uid, x, ts, bot? }      → نعدّ التعليقات الحقيقية فقط (بدون bot)
   *  reacts/{pid}/{uid} = emoji                      → نعدّ تفاعلات غير البوتات
   *  - uid يبدأ بـ bot_ = قناة RSS ، bot:true بدونها = حساب تفاعلي ، غير ذلك = مستخدم حقيقي
   *  - لا يوجد impactScore مخزّن، فيُشتق من عدد التفاعلات الحقيقية (منحنى مشبع).
   */
  function adaptRtdbPosts(posts, comments, reacts, opts) {
    opts = opts || {};
    const isBotUid = opts.isBotUid || function (u) { return String(u || '').indexOf('bot_') === 0; };
    const sat = opts.reactSaturation || 6;
    comments = comments || {};
    reacts = reacts || {};

    return (posts || []).filter((v) => v && v.id != null).map((v) => {
      const cm = comments[v.id] || {};
      let realComments = 0;
      for (const k in cm) { const c = cm[k]; if (c && !c.bot) realComments++; }
      const rx = reacts[v.id] || {};
      let realReacts = 0;
      for (const u in rx) if (!isBotUid(u)) realReacts++;
      const rss = isBotUid(v.uid);
      const txt = String(v.x || '').replace(/https?:\/\/\S+/g, '').replace(/[\u064B-\u065F\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/[^\p{L}\p{N}]+/gu, ' ').trim().toLowerCase();
      const tag = Array.isArray(v.tg) && v.tg[0] ? String(v.tg[0]).replace(/^#/, '').toLowerCase() : '';
      return {
        id: v.id,
        authorId: v.uid,
        authorHandle: v.h,
        sourceType: rss ? 'rss' : (v.bot ? 'bot' : 'user'),
        category: tag || (rss ? 'news' : 'general'),
        impactScore: Math.round(100 * (1 - Math.exp(-realReacts / sat))),
        commentsCount: realComments,
        createdAt: v.ts,
        dupKey: txt.length >= 25 ? txt.slice(0, 50) : undefined,
      };
    });
  }

  function runDemo() {
    const now = Date.now();
    const h = (x) => now - x * 3.6e6;
    const posts = [];
    let id = 0;
    const add = (authorId, sourceType, category, impact, comments, ageH) =>
      posts.push({ id: ++id, authorId, authorHandle: '@' + authorId, sourceType, category, impactScore: impact, commentsCount: comments, createdAt: h(ageH) });

    for (let i = 0; i < 12; i++) add('aljazeera', 'rss', 'news', 80 - i, 5, 1 + i * 0.5);
    for (let i = 0; i < 8; i++) add('techcrunch', 'rss', 'tech', 70 - i, 3, 1 + i * 0.7);
    for (let i = 0; i < 6; i++) add('kooora', 'rss', 'sports', 75 - i, 8, 2 + i);
    add('qais', 'user', 'design', 20, 0, 0.1);
    add('sara', 'user', 'tech', 40, 6, 3);
    add('ali', 'user', 'sports', 35, 2, 5);
    add('vybe_bot', 'bot', 'tech', 60, 4, 2);
    add('vybe_design', 'bot', 'design', 55, 3, 4);

    const feed = generateSmartFeed(posts, { now, limit: 20, debug: true });
    feed.forEach((p, i) =>
      console.log(String(i + 1).padStart(2) + '. ' + p.authorId.padEnd(12) + ' [' + p.sourceType + '/' + p.category + '] score=' + p.feedMeta.finalScore.toFixed(3)));

    let ok = true; const counts = {};
    for (let i = 0; i < feed.length; i++) {
      counts[feed[i].authorId] = (counts[feed[i].authorId] || 0) + 1;
      if (i > 0 && feed[i].authorId === feed[i - 1].authorId) ok = false;
    }
    const capOk = Object.values(counts).every((n) => n <= DEFAULT_CONFIG.perSourceCap);
    console.log('\nNo consecutive same author: ' + (ok ? 'PASS' : 'FAIL') + ' | Per-source cap: ' + (capOk ? 'PASS' : 'FAIL'));
  }

  return { generateSmartFeed, adaptRtdbPosts, DEFAULT_CONFIG, runDemo };
});

</style><main class="app">

  const $=s=>SR.querySelector(s);

    hubs:S('<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4.500" height="6" rx="1.800"/><rect x="16.500" y="14" width="4.500" height="6" rx="1.800"/>',1.8),
    cup:S('<path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.500 20h7M10 17h4"/>',1.8),

  /* ---------- data ---------- */
  const BADGES={champ:{i:PostKit.VB.replace('class="vfy"','class="vfy sm"'),l:"حساب موثّق",c:"g"},streak:{i:"🔥",l:"نشط يومياً",c:"n"},top5:{i:"⭐",l:"الأكثر تفاعلاً",c:"g"},host:{i:"✍️",l:"كاتب",c:"n"},eye:{i:"🎨",l:"مصمم مبدع",c:"n"}};
  const CREATORS=PostKit.CREATORS,POSTS=PostKit.POSTS;
  const TAGS=[];
  const TRY=[];

  /* ---------- state ---------- */
  const st={q:"",tab:"all"};
  const following=new Set();
  let recents=[];
  try{const r=JSON.parse(localStorage.getItem("vybe-recents")||"null");if(Array.isArray(r))recents=r.slice(0,6)}catch(_){}
  const saveRecents=()=>{try{localStorage.setItem("vybe-recents",JSON.stringify(recents))}catch(_){}};

  /* ---------- Arabic-aware matching ---------- */
  const DIAC=/[\u064B-\u065F\u0670\u0640]/;
  const MAP={"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ة":"ه","ى":"ي","ؤ":"و","ئ":"ي","_":" "};
  const nch=c=>{if(DIAC.test(c))return"";c=c.toLowerCase();return MAP[c]||c};
  function normMap(s){let out="";const map=[];for(let i=0;i<s.length;i++){const r=nch(s[i]);if(r){out+=r;map.push(i)}}return{out,map}}
  const normQ=s=>normMap(String(s)).out.replace(/^[#@\s]+/,"").replace(/\s+/g," ").trim();
  const tokens=q=>q.split(" ").filter(Boolean);
  function score(fields,toks){
    let total=0;
    for(const t of toks){
      let best=0;
      for(const[text,w] of fields){
        const h=normMap(text).out,i=h.indexOf(t);
        if(i>=0)best=Math.max(best,w+(i===0?w*.5:0));
      }
      if(!best)return 0;total+=best;
    }
    return total;
  }
  function hl(text,toks){
    if(!toks.length)return esc(text);
    const{out,map}=normMap(text);
    for(const t of toks){
      const i=out.indexOf(t);
      if(i>=0){
        const s=map[i],e=map[i+t.length-1]+1;
        return esc(text.slice(0,s))+"<mark>"+esc(text.slice(s,e))+"</mark>"+esc(text.slice(e));
      }
    }
    return esc(text);
  }
  function run(){
    const q=normQ(st.q),toks=tokens(q),has=toks.length>0;
    let cr,tg,po;
    if(has){
      po=POSTS.map(p=>{const u=CREATORS.find(c=>c.id===p.by);return{p,s:score([[p.x,10],[p.tg.join(" "),7],[u.n,5],[u.h,4]],toks)}}).filter(x=>x.s).sort((a,b)=>b.s-a.s||b.p.lk-a.p.lk).map(x=>x.p);
      cr=CREATORS.map(c=>({c,s:score([[c.n,10],[c.h,9],[c.t,4],[c.tg.join(" "),5]],toks)})).filter(x=>x.s).sort((a,b)=>b.s-a.s||b.c.fl-a.c.fl).map(x=>x.c);
      tg=TAGS.map(t=>({t,s:score([[t.t,10],[t.cat,3]],toks)})).filter(x=>x.s).sort((a,b)=>b.s-a.s||b.t.c-a.t.c).map(x=>x.t);
    }else{
      po=POSTS.slice().sort((a,b)=>b.lk-a.lk);
      cr=CREATORS.filter(c=>c.id!==0).sort((a,b)=>b.fl-a.fl);
      tg=TAGS.slice().sort((a,b)=>b.c-a.c);
    }
    return{q,toks,has,cr,tg,po};
  }

  /* ---------- render pieces ---------- */
  const secHead=(title,en,count,goTab)=>`<div class="sh"><h2>${title}<small>${en}</small></h2>${goTab?`<button class="more" type="button" data-tab="${goTab}">عرض الكل${count?` (${count})`:""}</button>`:""}</div>`;
  function tagRow(t,i,toks,rank){
    const lead=rank?`<span class="rk${i<3?" top":""}">${i<3?IC.fire:i+1}</span>`:`<span class="rk top">${IC.hash}</span>`;
    return `<button class="tg anim" type="button" data-tag="${esc(t.t)}" style="animation-delay:${Math.min(i,8)*40}ms">${lead}
      <span class="tb"><b>#${hl(t.t,toks)}</b><span><span class="num">${fmtK(t.c)}</span> منشور · ${hl(t.cat,toks)}</span></span>
      <span class="tr">▲ ${t.d}%</span></button>`;
  }
  function creatorRow(c,i,toks){
    const f=following.has(c.h);

    return `<article class="cr anim" style="animation-delay:${Math.min(i,8)*40}ms">
      <span class="ava" data-t="${c.tier}" data-open="${esc(c.h)}">${esc(c.n[0])}</span>
      <div class="ci" data-open="${esc(c.h)}"><b>${hl(c.n,toks)}${PostKit.isV(c.h)?PostKit.VB:""}</b><span class="h">@${hl(c.h,toks)}</span><span class="t">${hl(c.t,toks)}</span>
        ${bds?`<div class="bds">${bds}</div>`:""}

  }
  const postCard=(p,i,toks)=>PostKit.card(p,i,toks,hl);
  function recentsSec(){

  }
  const emptyState=q=>`<div class="empty"><span class="ei">${IC.search}</span><b>لا نتائج لـ «${esc(q)}»</b>

  /* ---------- render ---------- */
  const TABS=[["all","الكل"],["creators","حسابات"],["posts","المنشورات"],["tags","الوسوم #"]];
  function renderTabs(r){
    $("#tabs").innerHTML=TABS.map(([k,l])=>{
      const n=!r.has?0:k==="all"?r.cr.length+r.tg.length+r.po.length:k==="creators"?r.cr.length:k==="posts"?r.po.length:r.tg.length;

    };

    else if(t==="creators")h+=secC(0);

  /* ---------- interactions ---------- */
  let tt;

  function remember(v){

  const inp=$("#q");

  {const st=document.createElement("style");st.textContent=PostKit.XCSS;SR.appendChild(st)}

  $("#body").addEventListener("click",e=>{

  const paintAvas=()=>{const m={};Object.keys(USERS||{}).forEach(k=>{const u=USERS[k];if(u&&u.h&&window.vybeOkImg(u.pic))m[u.h]=u.pic});
    document.querySelectorAll('.ava[data-open]').forEach(el=>{const p=m[el.dataset.open];if(!p||el.querySelector('img')||el.dataset.pp===p)return;el.dataset.pp=p;el.style.background='center/cover no-repeat url("'+p+'")';el.style.fontSize='0'})};
  let _pt=0;const _sch=()=>{if(_pt)return;_pt=requestAnimationFrame(()=>{_pt=0;paintAvas()})};
  db.ref('users').on('value',_sch);try{new MutationObserver(_sch).observe(document.body,{childList:true,subtree:true})}catch(_){}
  db.ref('followers/'+me).on('value',s=>Profile.set({fl:s.numChildren()}));
  db.ref('following/'+me).on('value',s=>Profile.set({fg:s.numChildren()}));
  document.addEventListener('click',()=>setTimeout(push,300),true);
}
window.vybeSaveUserImg=async(k,u)=>{if(k!=='pic'&&k!=='cover')return;await db.ref('users/'+VME.uid+'/'+k).set(u)};
window.vybeSaveBio=async b=>{try{await db.ref('users/'+VME.uid+'/bio').set(b)}catch(e){try{toast(err(e))}catch(_){}}};
/* ---- القصص: تُنشر على Firebase وتظهر لكل من يتابع الحساب (24 ساعة) ---- */
const SDAY=864e5;
window.vybeStoryPub=async s=>{
  try{
    const src=/^blob:/.test(s.src||'')?'':(s.src||'');
    const rec=JSON.parse(JSON.stringify({id:s.id,uid:VME.uid,n:VME.n,h:VME.h,x:s.x||'',src,bg:s.bg||null,ts:s.ts}));
    await db.ref('stories/'+VME.uid+'/'+s.id).set(rec);
  }catch(e){try{toast(err(e))}catch(_){}}
};
window.vybeStoryDel=async id=>{try{await db.ref('stories/'+VME.uid+'/'+id).remove()}catch(e){try{toast(err(e))}catch(_){}}};
const STL={},STR={};let stOwnWired=false;
function stPush(){
  const now=Date.now();
  const list=Object.keys(STR).map(uid=>{
    const sl=Object.values(STR[uid]||{}).filter(v=>v&&v.ts&&now-v.ts<SDAY&&(v.src||v.bg)).sort((a,b)=>a.ts-b.ts);
    if(!sl.length)return null;
    const u=USERS[uid]||{},f=sl[0];
    return{uid,h:u.h||f.h||'user',n:u.n||f.n||'مستخدم',pic:window.vybeOkImg(u.pic)?u.pic:'',slides:sl.map(v=>({id:v.id,bg:v.bg||null,src:v.src||'',x:v.x||'',ts:v.ts}))};
  }).filter(Boolean);
  try{window.vybeStoryRemote&&vybeStoryRemote(list)}catch(e){console.error('stories',e)}
}
/* يستمع فقط لقصص الحسابات التي أتابعها */
function stWire(){
  const me=VME.uid;if(!me)return;
  const want=new Set(Object.keys(FW).filter(u=>u!==me&&FW[u]&&FW[u].by&&FW[u].by[me]));
  Object.keys(STL).forEach(u=>{if(!want.has(u)){STL[u]();delete STL[u];delete STR[u]}});
  want.forEach(u=>{if(STL[u])return;const r=db.ref('stories/'+u),cb=r.on('value',s=>{STR[u]=s.val()||{};stPush()},e=>{});STL[u]=()=>r.off('value',cb)});
  stPush();
}
/* قصصي: مزامنة من Firebase + حذف المنتهي */
function stOwn(){
  if(stOwnWired)return;stOwnWired=true;const me=VME.uid;
  db.ref('stories/'+me).on('value',s=>{
    const v=s.val()||{},now=Date.now();
    Object.keys(v).forEach(k=>{if(v[k]&&now-v[k].ts>=SDAY)db.ref('stories/'+me+'/'+k).remove().catch(()=>{})});
    const list=Object.values(v).filter(x=>x&&x.ts&&now-x.ts<SDAY);
    try{window.vybeStoryOwn&&vybeStoryOwn(list)}catch(e){console.error('stories',e)}
  },e=>{try{toast(err(e))}catch(_){}});
}
/* ---- صفحة "لك": اكتشاف منشورات مرتّبة حسب التفاعل والحداثة + فلاتر الأقسام ---- */
let fyRaf=0;
const fyE=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fyImg=p=>{const im=(p.imgs&&p.imgs[0])||p.img||'';if(window.vybeOkImg(im))return im;const v=p.vid;if(v&&v.t==='y'&&/^[\w-]{6,20}$/.test(v.u||''))return'https://i.ytimg.com/vi/'+v.u+'/hqdefault.jpg';return''};
function fyList(){
  const PS=PostKit.POSTS,CR=PostKit.CREATORS,me=VME.uid,now=Date.now(),out=[];
  PS.forEach(p=>{
    if(p._hide||p.by===0)return;
    const c=CR.find(k=>k.id===p.by);if(!c)return;
    const eng=Object.keys(RXALL[p.id]||{}).length+2*Object.keys(CMALL[p.id]||{}).length;
    const age=Math.max(0,(now-(p.ts||now))/36e5);
    let s=(1+Math.log1p(eng))*Math.pow(.5,age/24);
    if(c.uid&&FW[c.uid]&&FW[c.uid].by&&FW[c.uid].by[me])s*=1.25;
    out.push({p,c,s});
  });
  out.sort((a,b)=>b.s-a.s);
  return out;
}
function fyCard(x,img,hh){
  const p=x.p,c=x.c,u=USERS[c.uid]||{},pic=window.vybeOkImg(u.pic)?u.pic:'',hue=hueOf(c.uid||c.h);
  const bg=img?`background:center/cover no-repeat url('${img}')`:`background:linear-gradient(150deg,hsl(${hue} 68% 52%),hsl(${(hue+40)%360} 62% 36%))`;
  const t=String(p.x||'').trim().split(/\n+/)[0];
  return `<article class="cd fy${img?'':' tx'}" data-fy="${p.id}" style="height:${hh}px;${bg}" role="button" tabindex="0"><div>${t?`<p>${fyE(t)}</p>`:''}<span><i style="${pic?`background:center/cover no-repeat url('${pic}')`:''}">${pic?'':fyE((c.n||'؟')[0])}</i><em>${fyE(c.n)}</em></span></div></article>`;
}
function fyDraw(){
  const f2=document.getElementById('f2'),m=document.getElementById('f2m');if(!f2||!m||f2.hidden)return;
  let list=fyList();
  /* تنويع: لا يتكرر نفس الحساب متتالياً */
  const pool=list.slice();list=[];let last=null;
  while(pool.length){let i=pool.findIndex(x=>x.c.uid!==last);if(i<0)i=0;const x=pool.splice(i,1)[0];list.push(x);last=x.c.uid}
  if(!list.length){m.innerHTML='<div class="fy-em">لا توجد منشورات حالياً</div>';return}
  const cols=[[],[]],h=[0,0];
  list.forEach(x=>{const img=fyImg(x.p),hh=img?190+(x.p.id%3)*45:150+(x.p.id%2)*40,k=h[0]<=h[1]?0:1;cols[k].push(fyCard(x,img,hh));h[k]+=hh+10});
  m.innerHTML=cols.map(c=>'<div>'+c.join('')+'</div>').join('');
}
function fyRender(){if(fyRaf)return;fyRaf=requestAnimationFrame(()=>{fyRaf=0;try{fyDraw()}catch(e){console.error('foryou',e)}})}
(function fyInit(){
  const st=document.createElement('style');st.textContent=`#hm>.chips{display:none!important}.cd.fy{cursor:pointer;width:100%;text-align:start;border:0}.cd.fy>div{position:relative;width:100%;min-width:0}
.cd.fy p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.cd.fy.tx p{font-size:15px;line-height:1.6;-webkit-line-clamp:6;font-weight:700}
.cd.fy i{display:grid;place-items:center;font-size:10px;font-style:normal;font-weight:700;flex:none;overflow:hidden;background-color:rgba(255,255,255,.3)}
.cd.fy em{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd.fy:active{transform:scale(.985)}.fy-em{flex:1;text-align:center;color:var(--tx2);padding:70px 20px;font-size:13px}`;
  document.head.appendChild(st);
  const t2=document.getElementById('t2'),m=document.getElementById('f2m');
  if(t2)t2.addEventListener('click',fyDraw);
  if(m){const open=e=>{const a=e.target.closest('[data-fy]');if(a)PostKit.openPost(+a.dataset.fy)};
    m.addEventListener('click',open);m.addEventListener('keydown',e=>{if(e.key==='Enter')open(e)})}
})();
window.vybePublish=async p=>{
  try{
    const ts=p.ts||Date.now(),tg=((p.x||'').match(/#[\w\u0600-\u06FF_]+/g)||[]).map(t=>t.slice(1));
    let mu=p.mu||null;if(mu&&/^blob:/.test(mu.u||''))mu=null;
    const rec=JSON.parse(JSON.stringify({id:ts,uid:VME.uid,n:VME.n,h:VME.h,x:p.x||'',tg,imgs:(p.imgs||[]).filter(u=>!/^blob:/.test(u)),mu,ts}));
    await db.ref('posts/'+ts+'_'+VME.uid.slice(0,6)).set(rec);
  }catch(e){try{toast(err(e))}catch(_){}}
};
})();
</script>
